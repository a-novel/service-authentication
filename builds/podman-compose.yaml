# Podman drops a Dockerfile's HEALTHCHECK from OCI images, the format it builds by default and the
# one images are published in: a service the others wait for declares its check here.
x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD", "pg_isready"]
  interval: 1s
  timeout: 5s
  retries: 10

# The targets leave POSTGRES_PORT unset and reach the database on its default port, 5432. The
# a-novel daemon owns that name for the host port it publishes the database on.
services:
  # ====================================================================================================================
  # EXT. DEPENDENCIES
  # ====================================================================================================================

  mailserver:
    image: ghcr.io/axllent/mailpit:v1.32.0
    ports:
      # SMTP listener for the rest target, UI for the operator's browser. A rest
      # process on the host needs the SMTP publish to reach mailpit, or
      # /v2/healthcheck reports "client:smtp down".
      - "${SMTP_PORT}:1025"
      - "${MAIL_UI_PORT}:8025"
    networks:
      - api
    restart: unless-stopped
    volumes:
      - mailserver-data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SEND_API_AUTH_ACCEPT_ANY: true
      MP_SMTP_AUTH_ACCEPT_ANY: true
      MP_SMTP_AUTH_ALLOW_INSECURE: true
      MP_SENDMAIL_FROM: noreply@agorastoryverse.com
      MP_DISABLE_WAL: true
      MP_VERBOSE: true

  # ====================================================================================================================
  # DATABASE
  # ====================================================================================================================

  postgres-authentication:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - api
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    volumes:
      - authentication-postgres-data:/var/lib/postgresql/
    healthcheck: *postgres-healthcheck

  # ====================================================================================================================
  # ONE-SHOT TARGETS
  # ====================================================================================================================

  service-authentication-maintenance:
    profiles: ["maintenance"]
    build:
      context: ..
      dockerfile: ./builds/maintenance.Dockerfile
    depends_on:
      postgres-authentication:
        condition: service_healthy
      mailserver:
        condition: service_started
      service-authentication-migrations:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres-authentication
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: false
      PLATFORM_AUTH_URL: "${PLATFORM_AUTH_URL}"
      SMTP_SENDER_DOMAIN: "${SMTP_HOST}"
      SMTP_ADDR: "${SMTP_HOST}:${SMTP_PORT}"
      SMTP_SENDER_NAME: Agora [noreply]
      SMTP_SENDER_EMAIL: noreply@agorastoryverse.com
      SMTP_SENDER_PASSWORD: noreply
      SMTP_FORCE_UNENCRYPTED: true
    networks:
      - api

  service-authentication-migrations:
    # Also under the profiles of the targets waiting for it, so `--profile <target>` runs it first.
    profiles: ["migrations", "maintenance"]
    build:
      context: ..
      dockerfile: ./builds/migrations.Dockerfile
    depends_on:
      postgres-authentication:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-authentication
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: false
    networks:
      - api

  # ====================================================================================================================
  # LONG-RUNNER TARGETS
  # ====================================================================================================================

  service-authentication-rest:
    profiles: ["rest"]
    build:
      context: ..
      dockerfile: ./builds/standalone.rest.Dockerfile
    # Clears REST_TIMEOUT_SHUTDOWN (25s), which in turn clears SMTP_TIMEOUT (20s). On SIGTERM the
    # server drains its requests and then waits on the detached email sends; the runtime's 10s
    # default sends SIGKILL partway through, dropping whatever is still going out.
    stop_grace_period: 30s
    ports:
      - "${REST_PORT}:8080"
    depends_on:
      postgres-authentication:
        condition: service_healthy
      mailserver:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres-authentication
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: false
      # The Go config reads SERVICE_JSON_KEYS_HOST/PORT; bridge them to the
      # allocated SERVICE_JSON_KEYS_GRPC_* values.
      SERVICE_JSON_KEYS_HOST: "${SERVICE_JSON_KEYS_GRPC_HOST}"
      SERVICE_JSON_KEYS_PORT: "${SERVICE_JSON_KEYS_GRPC_PORT}"
      PLATFORM_AUTH_URL: "${PLATFORM_AUTH_URL}"
      # SMTP_SENDER_DOMAIN must match the host portion of SMTP_ADDR: Go's
      # net/smtp PlainAuth rejects auth when the AUTH host differs from the
      # connection's serverName (MITM prevention).
      SMTP_SENDER_DOMAIN: "${SMTP_HOST}"
      SMTP_ADDR: "${SMTP_HOST}:${SMTP_PORT}"
      SMTP_SENDER_NAME: Agora [noreply]
      SMTP_SENDER_EMAIL: noreply@agorastoryverse.com
      SMTP_SENDER_PASSWORD: noreply
      SMTP_FORCE_UNENCRYPTED: true
      TERM: xterm-color
    networks:
      - api

networks:
  api:

volumes:
  authentication-postgres-data:
  mailserver-data:
