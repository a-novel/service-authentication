services:
  postgres-authentication:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - authentication-api-test
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  # The rate-limit counter store, with the ACL production gives the limiter: its commands on
  # httprate's keys, and no default user.
  valkey:
    image: docker.io/valkey/valkey:9.1.3-alpine
    ports:
      - "${VALKEY_PORT}:6379"
    networks:
      - authentication-api-test
    # A list: docker compose splits a string command by shell rules and drops it from ">" on.
    command:
      - valkey-server
      - --user
      - default
      - "off"
      - resetpass
      - --user
      - limiter
      - "on"
      - ">limiter"
      - "~httprate:*"
      - -@all
      - +mget
      - +incrby
      - +expire
      - +multi
      - +exec
      - +ping
    healthcheck:
      # valkey-cli exits 0 on a refused login, so the check reads the answer.
      test: ["CMD-SHELL", "valkey-cli --user limiter --pass limiter --no-auth-warning ping | grep -q PONG"]
      interval: 1s
      timeout: 5s
      retries: 10

networks:
  authentication-api-test:
