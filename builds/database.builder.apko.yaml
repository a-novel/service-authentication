# The pgBackRest build toolchain: the runtime config plus what compiling needs. GCC writes its
# version into the binary, so this is locked too. Refresh the lock with
# apko lock builds/database.builder.apko.yaml --arch x86_64 --output builds/database.builder.apko.lock.json
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox
    - ca-certificates-bundle
    - postgresql-18
    - postgresql-18-client
    - postgresql-18-contrib
    - postgresql-18-oci-entrypoint-base
    - gosu
    - glibc-locale-en
    - libxml2-16
    - libbz2-1
    - lz4
    - zstd
    - libssh2
    - openssl
    - build-base
    - meson
    - ninja
    - pkgconf
    - bzip2-dev
    - lz4-dev
    # Let the SDK dependencies select their compatible OpenSSL development package.
    - pc:openssl
    - postgresql-18-dev
    - libxml2-dev
    - zlib-dev
    - zstd-dev
    - libssh2-dev
accounts:
  groups:
    - groupname: postgres
      gid: 999
  users:
    - username: postgres
      uid: 999
      gid: 999
      homedir: /var/lib/postgresql
paths:
  - path: /var/lib/postgresql
    type: directory
    uid: 999
    gid: 999
    permissions: 0700
  - path: /var/run/postgresql
    type: directory
    uid: 999
    gid: 999
    permissions: 03775
