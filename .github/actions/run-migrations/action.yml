name: run-migrations

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: "go.mod"
    - name: Download Go packages
      shell: bash
      run: go mod download
    - name: Run migrations
      shell: bash
      run: go run cmd/migrations/main.go
