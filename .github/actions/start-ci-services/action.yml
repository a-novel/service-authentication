name: start-ci-services
description: Start and wait for the requested CI Compose topology.

inputs:
  services:
    required: true
    description: Space-separated Compose services to start.
  database_image:
    required: false
    default: service-authentication-database:ci
    description: Authentication database image reference.
  standalone_rest_image:
    required: false
    default: service-authentication-standalone-rest:ci
    description: Authentication standalone REST image reference.
  json_keys_database_image:
    required: false
    default: ghcr.io/a-novel/service-json-keys/database:v2.15.5@sha256:06457d216da6416e58262893731c6caf4382d74e89baa13aa79eaffd629c771c
    description: JSON keys database image reference.
  json_keys_grpc_image:
    required: false
    default: ghcr.io/a-novel/service-json-keys/standalone-grpc:v2.15.5@sha256:3a16b2ba54bb403b38f8647160cc99d1150a13105a832bfeb18a2bdb07135fcc
    description: JSON keys gRPC image reference.
  service_token_issuer_image:
    required: false
    default: ghcr.io/a-novel/service-authentication/service-token-issuer:v2.25.1@sha256:29ee2b6e451c56f6cdcd01066e08f75ff262e4cfcd03629f5499637e20b0f43f
    description: Service-token issuer image reference.
  mailserver_image:
    required: false
    default: ghcr.io/axllent/mailpit:v1.33.0
    description: Mailpit image reference.
  valkey_image:
    required: false
    default: docker.io/valkey/valkey:9.1.3-alpine
    description: Valkey image reference, the version production runs.
  registry_login:
    required: false
    default: "false"
    description: When "true", authenticate to ghcr.io with the current job token.

runs:
  using: composite
  steps:
    - name: Log in to the container registry
      if: inputs.registry_login == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REGISTRY_USERNAME: ${{ github.actor }}
      run: |
        set -euo pipefail
        printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${REGISTRY_USERNAME}" --password-stdin

    - name: Start CI services
      shell: bash
      env:
        CI_SERVICES: ${{ inputs.services }}
        COMPOSE_PROJECT_NAME: ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        DATABASE_IMAGE: ${{ inputs.database_image }}
        STANDALONE_REST_IMAGE: ${{ inputs.standalone_rest_image }}
        JSON_KEYS_DATABASE_IMAGE: ${{ inputs.json_keys_database_image }}
        JSON_KEYS_GRPC_IMAGE: ${{ inputs.json_keys_grpc_image }}
        SERVICE_TOKEN_ISSUER_IMAGE: ${{ inputs.service_token_issuer_image }}
        MAILSERVER_IMAGE: ${{ inputs.mailserver_image }}
        VALKEY_IMAGE: ${{ inputs.valkey_image }}
        POSTGRES_PASSWORD: postgres
      run: |
        set -euo pipefail
        read -r -a services <<< "${CI_SERVICES}"

        set +e
        docker compose --file builds/compose.ci.yaml up \
          --detach \
          --no-build \
          --wait \
          --wait-timeout 120 \
          "${services[@]}"
        status=$?
        set -e

        if (( status == 0 )); then
          exit 0
        fi

        docker compose --file builds/compose.ci.yaml ps --all || true
        docker compose --file builds/compose.ci.yaml logs --no-color || true
        exit "${status}"
