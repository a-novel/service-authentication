name: release

# Releases are cut from the GitHub UI (Actions ▸ release ▸ pick a type ▸ Run) or
# by the release train, through workflow_call's identical inputs. `plan`
# rehearses with no credential; `cut` runs in the protected `release` environment,
# the "who can publish" gate whose key only it reads, and pushes the version
# commit, the tag and the GitHub Release as the release App.
#
# The tag then runs this workflow again, and that run publishes: the images and
# their attestations, the JS package, and the pin dispatch. Only the release App
# and admins can create a tag, so one approval covers the release, and a hotfix
# tag publishes its line the same way. The builds tag their images from the tag
# ref (build-actions with no `version:`) and pull the database image at it.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to cut
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Bump & report only — no commit, tag, push, or release
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

run-name: "${{ github.event_name == 'push' && format('📦 publish {0}', github.ref_name) || format('🚀 release {0}{1}', inputs.release_type, inputs.dry_run && ' (dry-run)' || '') }}"

jobs:
  plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/publish-actions/release-core@v1.61.1
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.7.5"
          release_type: ${{ inputs.release_type }}
          dry_run: "true"

  cut:
    needs: [plan]
    if: github.event_name != 'push' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/publish-actions/release-core@v1.61.1
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.7.5"
          release_type: ${{ inputs.release_type }}
          client_id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  build-database:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.61.1
        with:
          file: builds/database.Dockerfile
          image_name: ${{ github.repository }}/database
          cache: false
          # Infra tells a real database change from a release by digest: an unchanged image keeps it.
          reproducible: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_args: -e POSTGRES_PASSWORD=postgres

  build-migrations:
    runs-on: ubuntu-latest
    needs: [build-database]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &start-release-database
        uses: $/.github/actions/start-ci-services
        with:
          services: postgres
          database_image: ghcr.io/a-novel/service-authentication/database:${{ github.ref_name }}
          registry_login: "true"
      - uses: a-novel-kit/workflows/build-actions/docker-job@v1.61.1
        with:
          file: builds/migrations.Dockerfile
          image_name: ${{ github.repository }}/jobs/migrations
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_args: -e POSTGRES_DSN="${POSTGRES_DSN}"

  build-job-maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker-job@v1.61.1
        with:
          file: builds/maintenance.Dockerfile
          image_name: ${{ github.repository }}/jobs/maintenance
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-rest:
    needs: [build-database]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SERVICE_JSON_KEYS_PORT: 4001
      SERVICE_JSON_KEYS_HOST: 0.0.0.0
      PLATFORM_AUTH_URL: http://localhost:6000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &start-release-build-dependencies
        uses: $/.github/actions/start-ci-services
        with:
          services: postgres service-json-keys
          database_image: ghcr.io/a-novel/service-authentication/database:${{ github.ref_name }}
          registry_login: "true"
      - uses: $/.github/actions/run-migrations
      - uses: a-novel-kit/workflows/build-actions/docker@v1.61.1
        with:
          file: builds/rest.Dockerfile
          image_name: ${{ github.repository }}/rest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_args: >-
            -e POSTGRES_DSN="${POSTGRES_DSN}"
            -e SERVICE_JSON_KEYS_PORT="${SERVICE_JSON_KEYS_PORT}"
            -e SERVICE_JSON_KEYS_HOST="${SERVICE_JSON_KEYS_HOST}"
            -e PLATFORM_AUTH_URL="${PLATFORM_AUTH_URL}"

  build-standalone-rest:
    needs: [build-database]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SERVICE_JSON_KEYS_PORT: 4001
      SERVICE_JSON_KEYS_HOST: 0.0.0.0
      PLATFORM_AUTH_URL: http://localhost:6000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *start-release-build-dependencies
      - uses: $/.github/actions/run-migrations
      - uses: a-novel-kit/workflows/build-actions/docker@v1.61.1
        with:
          file: builds/standalone.rest.Dockerfile
          image_name: ${{ github.repository }}/standalone-rest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_args: >-
            -e POSTGRES_DSN="${POSTGRES_DSN}"
            -e SERVICE_JSON_KEYS_PORT="${SERVICE_JSON_KEYS_PORT}"
            -e SERVICE_JSON_KEYS_HOST="${SERVICE_JSON_KEYS_HOST}"
            -e PLATFORM_AUTH_URL="${PLATFORM_AUTH_URL}"

  # Publish the JS client from the checked-out release tag.
  build-js:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: a-novel-kit/workflows/publish-actions/npm@v1.61.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Infra pins the published images in one pull request, which deploys the release once it merges.
  deploy:
    needs:
      - build-database
      - build-migrations
      - build-job-maintenance
      - build-rest
      - build-standalone-rest
      - build-js
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The Agent key is a secret of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    permissions: {}
    steps:
      - uses: a-novel-kit/workflows/publish-actions/deploy-release@v1.61.1
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          version: ${{ github.ref_name }}

  # Everything shipped — clear this repo's awaiting-release board items.
  archive:
    needs:
      - build-database
      - build-migrations
      - build-job-maintenance
      - build-rest
      - build-standalone-rest
      - build-js
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The Agent key is a secret of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/archive-board-items@v1.61.1
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          project_id: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
