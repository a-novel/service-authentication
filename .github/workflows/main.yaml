name: main

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

# A newer push to a pull request cancels its older run, freeing the shared runners. Each label
# event, which GitHub can admit out of order, and every non-PR run gets a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}${{ endsWith(github.event.action, 'labeled') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  check-migration-snapshots:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Removes append-only-override once a push makes it stale.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check schema snapshots
        uses: a-novel-kit/workflows/generic-actions/check-append-only@v1.87.1
        with:
          path: internal/models/migrations/testdata/schema
          base: ${{ github.event.pull_request.base.sha }}
          github_token: ${{ github.token }}
      - name: Check migration SQL
        uses: a-novel-kit/workflows/generic-actions/check-append-only@v1.87.1
        with:
          path: ":(glob)internal/models/migrations/*.sql"
          base: ${{ github.event.pull_request.base.sha }}
          github_token: ${{ github.token }}

  generated-go:
    needs: [build-database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &start-local-database
        uses: $/.github/actions/start-ci-services
        with:
          services: postgres
          database_image: ghcr.io/${{ github.repository }}/database@${{ needs.build-database.outputs.digest }}
          registry_login: "true"
      - uses: a-novel-kit/workflows/go-actions/generate-go@v1.87.1

  generated-pnpm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/setup-node@v1.87.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # generate:mjml alone: the generate:go leg belongs to generated-go, which sets up Go.
      - name: pnpm generate:mjml
        shell: bash
        run: pnpm generate:mjml
      - uses: a-novel-kit/workflows/generic-actions/check-changes@v1.87.1
        with:
          fail_message: mail templates are not up-to-date, please run 'pnpm generate' and commit the changes

  lint-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/go-actions/lint-go@v1.87.1

  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/lint-node@v1.87.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint_action: "lint:ci"

  lint-shell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/lint-shell@v1.87.1
        with:
          run_steps: .github/actions/*/action.yml .github/workflows/*.yaml

  lint-dockerfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/lint-dockerfile@v1.87.1

  # Structural conventions golangci-lint cannot express.
  lint-semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/security-actions/lint-semgrep@v1.87.1
        with:
          ruleset: service

  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/security-actions/scan-secrets@v1.87.1
        with:
          extra_config: .gitleaks.toml

  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.87.1

  test-go:
    needs: [build-database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      artifact-id: ${{ steps.test.outputs.artifact-id }}
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      PLATFORM_AUTH_URL: http://localhost:7010
      VALKEY_PORT: 6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/start-ci-services
        with:
          services: postgres valkey
          database_image: ghcr.io/${{ github.repository }}/database@${{ needs.build-database.outputs.digest }}
          registry_login: "true"
      - uses: $/.github/actions/run-migrations
      # Exercises the real command wiring. The second run finds the matching active registration
      # and changes nothing.
      - name: Run the maintenance job
        shell: bash
        run: |
          go run ./cmd/maintenance account-role --email noreply@agorastoryverse.com --role auth:superadmin --lang en
          go run ./cmd/maintenance account-role --email noreply@agorastoryverse.com --role auth:superadmin --lang en
      - uses: a-novel-kit/workflows/go-actions/test-go@v1.87.1
        id: test
        with:
          include: /internal|/cmd
          skip_setup: true
          test_artifact: gotest
          coverage_artifact: gocover
          coverage_file: coverage.txt
          modfile: gotestsum.mod
          race: "true"

  # pkg/go, the published Go client, reaches no network and no database, so this lane starts no
  # services. It runs apart from test-go, which covers /internal and /cmd only.
  test-pkg:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.test.outputs.artifact-id }}
    steps:
      - uses: a-novel-kit/workflows/go-actions/test-go@v1.87.1
        id: test
        with:
          include: /pkg
          test_artifact: gotestpkg
          coverage_artifact: gocoverpkg
          coverage_file: coverage_pkg.txt
          modfile: gotestsum.mod
          race: "true"

  test-pkg-js:
    runs-on: ubuntu-latest
    needs: [build-database, build-standalone-rest]
    permissions:
      contents: read
      packages: read
    outputs:
      artifact-id: ${{ steps.test.outputs.artifact-id }}
    env:
      REST_URL: http://0.0.0.0:4000
      SUPER_ADMIN_EMAIL: noreply@agorastoryverse.com
      SUPER_ADMIN_PASSWORD: admin
      MAIL_UI_URL: http://0.0.0.0:8025
      SERVICE_TOKEN_ISSUER_URL: http://0.0.0.0:4002
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/start-ci-services
        with:
          services: standalone-rest
          database_image: ghcr.io/${{ github.repository }}/database@${{ needs.build-database.outputs.digest }}
          standalone_rest_image: ghcr.io/${{ github.repository }}/standalone-rest@${{ needs.build-standalone-rest.outputs.digest }}
          registry_login: "true"
      - uses: a-novel-kit/workflows/node-actions/test-node@v1.87.1
        id: test
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          coverage_artifact: jscover
          test_action: "test:ci"

  build-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.87.1
        id: build
        with:
          file: builds/database.Dockerfile
          image_name: ${{ github.repository }}/database
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_args: -e POSTGRES_PASSWORD=postgres

  # Infra tells a real database change from a version bump by digest alone, so the image must
  # rebuild to the same digest. The two builds run at once, each on its own fresh builder, so both
  # start cold, as a release does.
  test-reproducible-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/build-actions/check-reproducible@v1.87.1

  build-migrations:
    runs-on: ubuntu-latest
    needs: [build-database]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *start-local-database
      - uses: a-novel-kit/workflows/build-actions/docker@v1.87.1
        with:
          mode: job
          file: builds/migrations.Dockerfile
          image_name: ${{ github.repository }}/jobs/migrations
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_args: >-
            -e POSTGRES_HOST="${POSTGRES_HOST}"
            -e POSTGRES_PORT="${POSTGRES_PORT}"
            -e POSTGRES_USER="${POSTGRES_USER}"
            -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
            -e POSTGRES_DATABASE="${POSTGRES_DATABASE}"
            -e POSTGRES_TLS_ENABLED="${POSTGRES_TLS_ENABLED}"

  build-maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.87.1
        with:
          mode: job
          file: builds/maintenance.Dockerfile
          image_name: ${{ github.repository }}/jobs/maintenance
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-rest:
    needs: [build-database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      SERVICE_JSON_KEYS_PORT: 4001
      SERVICE_JSON_KEYS_HOST: 0.0.0.0
      PLATFORM_AUTH_URL: http://localhost:6000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/start-ci-services
        with:
          services: postgres service-json-keys
          database_image: ghcr.io/${{ github.repository }}/database@${{ needs.build-database.outputs.digest }}
          registry_login: "true"
      - uses: $/.github/actions/run-migrations
      - uses: a-novel-kit/workflows/build-actions/docker@v1.87.1
        with:
          file: builds/rest.Dockerfile
          image_name: ${{ github.repository }}/rest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The server refuses to start without a token issuer, which the smoke run has none of.
          run_args: >-
            -e POSTGRES_HOST="${POSTGRES_HOST}"
            -e POSTGRES_PORT="${POSTGRES_PORT}"
            -e POSTGRES_USER="${POSTGRES_USER}"
            -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
            -e POSTGRES_DATABASE="${POSTGRES_DATABASE}"
            -e POSTGRES_TLS_ENABLED="${POSTGRES_TLS_ENABLED}"
            -e SERVICE_JSON_KEYS_PORT="${SERVICE_JSON_KEYS_PORT}"
            -e SERVICE_JSON_KEYS_HOST="${SERVICE_JSON_KEYS_HOST}"
            -e PLATFORM_AUTH_URL="${PLATFORM_AUTH_URL}"
            -e SERVICE_ISSUER_OPTIONAL=true

  build-standalone-rest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    # test-pkg-js boots and exercises this image, so this job only builds and pushes it, without a
    # smoke run.
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.87.1
        id: build
        with:
          file: builds/standalone.rest.Dockerfile
          image_name: ${{ github.repository }}/standalone-rest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_healthcheck: true

  build-service-token-issuer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.87.1
        with:
          file: builds/service-token-issuer.Dockerfile
          image_name: ${{ github.repository }}/service-token-issuer
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_args: -e SERVICE_TOKEN_ISSUER=http://localhost:8080

  build-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/build-node@v1.87.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_action: "build:rest"

  report-codecov:
    runs-on: ubuntu-latest
    needs: [test-go, test-pkg, test-pkg-js]
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/codecov@v1.87.1
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
          coverage_files: coverage.txt,coverage_pkg.txt,coverage/*
          coverage_artifact_ids: ${{ needs.test-go.outputs.artifact-id }},${{ needs.test-pkg.outputs.artifact-id }},${{ needs.test-pkg-js.outputs.artifact-id }}

  publish-docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && success()
    # lint-js checks the openapi files this job deploys.
    needs: [lint-js]
    # GitHub Pages runs one deployment per site at a time, so master runs queue here.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: a-novel-kit/workflows/github-pages-actions/publish-api-docs@v1.87.1
