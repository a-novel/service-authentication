# Managed by `a-novel repo update` — edit the template in stack, not this copy.
#
# Reverts a landed Epic's merged members across repos and lands the reverts
# together, through the epic-rollback-run workflow. A rollback undoes merged code,
# so four fences guard it:
#
#   - Only an admin's dispatch runs.
#   - The operator types a confirmation.
#   - A dispatch prints the plan and writes nothing until dry_run is false.
#   - Each revert passes the same merge gate, review, queue and partial-landing
#     detector as the landing it undoes.
name: epic-rollback

on:
  workflow_dispatch:
    inputs:
      epic_number:
        description: The Epic number N to roll back (numeric).
        required: true
        type: string
      confirm:
        description: Type "revert-epic-<N>" exactly (e.g. revert-epic-42) to confirm you are reverting MERGED code.
        required: true
        type: string
      reason:
        description: Why INV-1 is violated (goes into the audit trail + the rollback-epic body).
        required: true
        type: string
      dry_run:
        description: "true (default) = print the plan only; false = actually open + land the reverts."
        required: false
        default: "true"
        # The UI and the dispatch API accept only these two values, so a mistyped
        # value cannot turn a live run into a rehearsal.
        type: choice
        options:
          - "true"
          - "false"
      max_rollback_repos:
        description: BLAST-CAP — abort if the rollback would touch more than this many distinct repos (default 5). Raise it deliberately for a genuinely wide rollback.
        required: false
        default: "5"
        type: string

run-name: "⏮ ROLLBACK epic:#${{ inputs.epic_number }} requested by @${{ github.actor }} (dry_run=${{ inputs.dry_run }})"

jobs:
  rollback:
    # A reusable workflow gets at most its caller's permissions, so the caller
    # grants exactly the callee's.
    permissions:
      contents: read
    uses: a-novel-kit/workflows/.github/workflows/epic-rollback-run.yaml@v1.67.0
    with:
      epic_number: ${{ inputs.epic_number }}
      confirm: ${{ inputs.confirm }}
      reason: ${{ inputs.reason }}
      dry_run: ${{ inputs.dry_run }}
      max_rollback_repos: ${{ inputs.max_rollback_repos }}
      client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
      project_id: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
      kill_switch: ${{ vars.AGENT_KILL_SWITCH }}
    secrets:
      app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
