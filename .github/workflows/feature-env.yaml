# Managed by `a-novel repo update` — edit the template in stack, not this copy.
#
# The with-feature-env label tags a pull request's images for the head it was added on. A push removes
# it, so the new head builds untagged until someone adds the label again.
name: feature env

on:
  pull_request:
    types: [synchronize]

permissions: {}

jobs:
  revoke-feature-env:
    if: contains(github.event.pull_request.labels.*.name, 'with-feature-env')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Remove the label a push made stale
        run: |
          set -euo pipefail
          if ! err=$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels/with-feature-env" --silent 2>&1); then
            # The run for an earlier push may have removed it first.
            [[ $err == *"HTTP 404"* ]] || { printf '::error::%s\n' "$err"; exit 1; }
          fi
