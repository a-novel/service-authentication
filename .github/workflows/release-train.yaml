# Managed by `a-novel repo update` — edit the template in stack, not this copy.
#
# Releases every repo a landed Epic touched, from one admin dispatch. The
# release-train-run workflow does the work: it finds the repos the `epic:<N>`
# pull requests merged into, derives each repo's semver bump from its commits,
# and runs each repo's release.yaml, a rehearsal first. Each released tag is
# recorded on the Epic, so a re-dispatch releases only the repos not shipped yet.
# A dispatch rehearses by default and cuts nothing until dry_run is false.
name: release-train

on:
  workflow_dispatch:
    inputs:
      epic_number:
        description: The Epic number N to release (numeric).
        required: true
        type: string
      dry_run:
        description: "true (default) = rehearse every repo, cut nothing; false = actually cut the releases."
        required: false
        default: "true"
        # The UI and the dispatch API accept only these two values, so a mistyped
        # value cannot cut a release.
        type: choice
        options:
          - "true"
          - "false"

run-name: "🚂 release train epic:#${{ inputs.epic_number }} requested by @${{ github.actor }} (dry_run=${{ inputs.dry_run }})"

jobs:
  release-train:
    # A reusable workflow gets at most its caller's permissions, so the caller
    # grants exactly the callee's.
    permissions:
      contents: read
    uses: a-novel-kit/workflows/.github/workflows/release-train-run.yaml@v1.71.0
    with:
      client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
      epic_number: ${{ inputs.epic_number }}
      dry_run: ${{ inputs.dry_run }}
      kill_switch: ${{ vars.AGENT_KILL_SWITCH }}
    secrets:
      app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
