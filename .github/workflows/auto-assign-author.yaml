# Managed by `a-novel repo update` — edit the template in stack, not this copy.
#
# Assigns a pull request to the person who opened it. A bot's pull request stays unassigned: an
# assignee would be notified of every version bump, and a failing one reaches the Discord
# dependencies feed instead. Skipping the job, rather than the step, spares a runner per bot PR.
name: auto-assign author

on:
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  assign-author:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: a-novel-kit/workflows/generic-actions/assign-bot@v1.60.0
        with:
          github_token: ${{ github.token }}
