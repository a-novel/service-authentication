name: run node audit
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  security-update:
    runs-on: ubuntu-latest
    # The privileged keys are secrets of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/audit@v1.79.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          client_id: ${{ vars.DEPENDENCY_BOT_CLIENT_ID }}
