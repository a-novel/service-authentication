# Managed by `a-novel repo update` — edit the template in stack, not this copy.
#
# Posts the required `epic-freeze` check, the per-PR half of the partial-landing
# detector. A standalone pull request or a healthy Epic member passes. A member of
# an Epic that landed partially fails, which blocks the pull request and drops its
# merge-queue group. The reconcile-board sweep runs the other half on the same
# predicate, so both halves agree on every pull request.
#
# The check has a file of its own, so a broken run here leaves merge-gate running,
# and the reverse. It arms no auto-merge, so a landing a person froze stays frozen.
name: epic-freeze

on:
  # The triggers match merge-gate.yaml. An `epic:<N>` label moves a pull request
  # between the standalone path and the Epic check. The check also posts on each
  # merge-queue group's head, or a queued pull request times out. Reviews and merge
  # groups run a pull request's own copy of a workflow, so they arrive through
  # pr-relay.yaml.
  pull_request_target: # zizmor: ignore[dangerous-triggers] The gate only calls the GitHub API; it never checks out the pull request.
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft
  workflow_run: # zizmor: ignore[dangerous-triggers] relay-context reads the relayed pull request through the API only.
    workflows: [pr-relay]
    types: [completed]

jobs:
  # The [Agent] App posts the `epic-freeze` check-run itself, so the job takes
  # another name.
  evaluate:
    # Dependabot is evaluated by the trusted CI-completion job.
    if: github.event_name == 'workflow_run' || github.actor != vars.DEPENDABOT_SECURITY_LOGIN
    runs-on: ubuntu-latest
    # The Agent key is a secret of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    # relay-context reads the relayed pull request with this job's token. The
    # detector mints its own [Agent] tokens, with checks write and reads for a
    # pull request. Only the sweep mints the token that rolls a stray forward, so
    # a per-PR run never re-enqueues.
    permissions:
      pull-requests: read
    steps:
      - id: relay
        if: github.event_name == 'workflow_run'
        uses: a-novel-kit/workflows/generic-actions/relay-context@v1.66.2
      - if: github.event_name != 'workflow_run' || steps.relay.outputs.event != ''
        uses: a-novel-kit/workflows/generic-actions/detect-partial-landing@v1.66.2
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          pull_request_number: ${{ steps.relay.outputs.pull_request_number || github.event.pull_request.number }}
          head_sha: ${{ steps.relay.outputs.head_sha || github.event.pull_request.head.sha }}
          merge_group_head_ref: ${{ steps.relay.outputs.merge_group_head_ref }}
          # Posts the epic-freeze check-run on this head: a success, or a failure
          # on a partial landing.
          dry_run: "false"
          # The org-wide halt. Engaged, the run posts a failing check on this
          # head, since a required check must always report.
          kill_switch: ${{ vars.AGENT_KILL_SWITCH }}
