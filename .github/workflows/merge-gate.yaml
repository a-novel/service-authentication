# Managed by `a-novel repo update` — edit the template in stack, not this copy.
#
# Posts the required `merge-gate` check and coordinates the landing of Epic
# members, through the merge-gate-run workflow. A standalone pull request passes,
# and an Epic member holds until every sibling is ready. The workflow also arms
# auto-merge on each member, so the set lands once the gate and the approvals pass.
name: merge-gate

on:
  # An `epic:<N>` label change re-evaluates membership, and any other label
  # re-posts the same result. ready_for_review and converted_to_draft flip this
  # pull request's own readiness. pull_request_target runs this default-branch
  # copy, which a pull request cannot rewrite.
  pull_request_target: # zizmor: ignore[dangerous-triggers] The gate only calls the GitHub API; it never checks out the pull request.
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft
  # Reviews and merge groups run a pull request's own copy of a workflow, so they
  # arrive through pr-relay.yaml.
  workflow_run: # zizmor: ignore[dangerous-triggers] relay-context reads the relayed pull request through the API only.
    workflows: [pr-relay]
    types: [completed]

jobs:
  merge-gate:
    # Dependabot is evaluated by the trusted CI-completion job.
    if: github.event_name == 'pull_request_target' && github.actor != vars.DEPENDABOT_SECURITY_LOGIN
    # The callee mints its own App token, so the caller grants it nothing.
    permissions: {}
    uses: a-novel-kit/workflows/.github/workflows/merge-gate-run.yaml@v1.66.2
    with:
      client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
      kill_switch: ${{ vars.AGENT_KILL_SWITCH }}
    secrets:
      app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}

  relay:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      event: ${{ steps.context.outputs.event }}
      pull_request_number: ${{ steps.context.outputs.pull_request_number }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      merge_group_head_ref: ${{ steps.context.outputs.merge_group_head_ref }}
    steps:
      - id: context
        uses: a-novel-kit/workflows/generic-actions/relay-context@v1.66.2

  relayed:
    needs: relay
    if: needs.relay.outputs.event != ''
    permissions: {}
    uses: a-novel-kit/workflows/.github/workflows/merge-gate-run.yaml@v1.66.2
    with:
      client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
      kill_switch: ${{ vars.AGENT_KILL_SWITCH }}
      pull_request_number: ${{ needs.relay.outputs.pull_request_number }}
      head_sha: ${{ needs.relay.outputs.head_sha }}
      merge_group_head_ref: ${{ needs.relay.outputs.merge_group_head_ref }}
    secrets:
      app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
