# Managed by `a-novel repo update` — edit the template in stack, not this copy.
#
# Derives the board Status of each issue a pull request closes from the pull
# request's state, and writes it as the [Agent] App:
#
#   draft           → In progress
#   open            → In review
#   approved        → Done
#   merged          → Awaiting release
#   closed unmerged → Ready
#
# Every pull request and review event runs it, and the per-org reconcile sweep
# repairs any drift.
name: derive-status

on:
  # Reviews run a pull request's own copy of a workflow, so they arrive through
  # pr-relay.yaml; merge groups it relays are ignored here.
  pull_request_target: # zizmor: ignore[dangerous-triggers] The gate only calls the GitHub API; it never checks out the pull request.
    types:
      - opened
      - reopened
      - converted_to_draft
      - ready_for_review
      - closed
      - synchronize
  workflow_run: # zizmor: ignore[dangerous-triggers] relay-context reads the relayed pull request through the API only.
    workflows: [pr-relay]
    types: [completed]

jobs:
  derive:
    runs-on: ubuntu-latest
    # The Agent key is a secret of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    # The job's token only reads the pull request and its closing issues.
    # board-write mints the [Agent] token for the write, so the App stays the
    # board's single writer.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - id: relay
        if: github.event_name == 'workflow_run'
        uses: a-novel-kit/workflows/generic-actions/relay-context@v1.74.0
      - if: github.event_name != 'workflow_run' || steps.relay.outputs.event == 'pull_request_review'
        uses: a-novel-kit/workflows/generic-actions/derive-status@v1.74.0
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          pull_request_number: ${{ steps.relay.outputs.pull_request_number || github.event.pull_request.number }}
          # The org's Tasks board.
          project_id: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
          # The org-wide halt. Engaged, the action writes no Status.
          kill_switch: ${{ vars.AGENT_KILL_SWITCH }}
