# Posts to this repository's Discord channels what a feed of the org's `.github` repository hands
# over, such as an issue's board move or a stuck pull request waiting on a review. That feed cannot
# read this repository's secrets, so it dispatches this workflow with the posts, in order, through
# generic-actions/discord-dispatch. A repository secret wins over the org's of the same name, so a
# repository without its own channel posts to the org's.
name: notify-post

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel the posts go to.
        required: true
        type: choice
        options: [issues, reviews]
      posts:
        description: >-
          JSON array of posts, each with title, url, description, color, ping and user_ids, as
          discord-dispatch describes.
        required: true
        type: string

permissions: {}

jobs:
  post:
    runs-on: ubuntu-latest
    # The Bitwarden token is a secret of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    permissions: {}
    strategy:
      # One post at a time keeps the channel in order and under Discord's rate limit.
      max-parallel: 1
      matrix:
        post: ${{ fromJSON(inputs.posts) }}
    steps:
      - name: Resolve the pings
        id: users
        if: matrix.post.ping && matrix.post.user_ids != ''
        uses: a-novel-kit/workflows/generic-actions/discord-users@v1.83.2
        with:
          github_user_ids: ${{ matrix.post.user_ids }}
          bws_access_token: ${{ secrets.BWS_READ_TOKEN }}
          bws_server_url: ${{ vars.BWS_SERVER_URL }}

      - name: Post
        uses: a-novel-kit/workflows/generic-actions/discord-post@v1.83.2
        with:
          # A post never falls back to the other channel.
          webhook: >-
            ${{ inputs.channel == 'issues' && secrets.ISSUES_WEBHOOK ||
            inputs.channel == 'reviews' && secrets.REVIEWS_WEBHOOK || '' }}
          color: ${{ matrix.post.color }}
          title: ${{ matrix.post.title }}
          url: ${{ matrix.post.url }}
          description: ${{ matrix.post.description }}
          mention_users: ${{ steps.users.outputs.discord_ids }}
          mention_roles: >-
            ${{ matrix.post.ping && matrix.post.user_ids == '' &&
            fromJSON(vars.DISCORD_REPO_ROLES || '{}')[github.repository] || '' }}
