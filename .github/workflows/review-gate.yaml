# Managed by `a-novel repo update` — edit the template in stack, not this copy.
#
# Posts the required `review-gate` check. A person's pull request needs an
# approval of its head from a maintainer or admin of this repository, and every
# privileged label on any pull request must have been applied last by one of
# them. Anyone with write access can approve and label, so this check is what
# ties merging to the maintainer tier. The [Agent] App posts it under the
# integration id the ruleset requires; this job only runs it, under an id kept
# clear of the check name.
name: review-gate

on:
  # pull_request_target runs this default-branch copy, which a pull request cannot
  # rewrite. Reviews and merge groups run a pull request's own copy of a workflow, so
  # they arrive through pr-relay.yaml.
  pull_request_target: # zizmor: ignore[dangerous-triggers] The gate only calls the GitHub API; it never checks out the pull request.
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_run: # zizmor: ignore[dangerous-triggers] relay-context reads the relayed pull request through the API only.
    workflows: [pr-relay]
    types: [completed]

# Nothing posts the check again later, so runs never overlap: each reads the pull
# request when it starts, and the last to run posts the latest verdict. A newer
# event replaces the waiting run, which never starts. Cancelling a running one would
# leave its cancelled job in the merge box, which shows each workflow's newest run.
concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  evaluate:
    # Dependabot is evaluated by the trusted CI-completion job in auto-approve-dependabot.yaml.
    if: github.event_name == 'workflow_run' || github.actor != vars.DEPENDABOT_SECURITY_LOGIN
    runs-on: ubuntu-latest
    # The Agent key is a secret of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    # The action mints its own App token for every read and the check; relay-context
    # reads the relayed pull request with this job's token.
    permissions:
      pull-requests: read
    steps:
      - id: relay
        if: github.event_name == 'workflow_run'
        uses: a-novel-kit/workflows/generic-actions/relay-context@v1.63.0
      - if: github.event_name != 'workflow_run' || steps.relay.outputs.event != ''
        uses: a-novel-kit/workflows/generic-actions/review-gate@v1.63.0
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          event: ${{ steps.relay.outputs.event || github.event_name }}
          pull_request_number: ${{ steps.relay.outputs.pull_request_number || github.event.pull_request.number }}
          head_sha: ${{ steps.relay.outputs.head_sha || github.event.pull_request.head.sha }}
          # Every label that waives a check or spends resources, across the fleet. The
          # Dependabot job in auto-approve-dependabot.yaml carries the same list.
          privileged_labels: |
            allow-dependency-change
            allow-downtime
            allow-incomplete-translations
            allow-resource-deletion
            allow-screenshot-change
            allow-translation-drift
            append-only-override
            with-feature-env
