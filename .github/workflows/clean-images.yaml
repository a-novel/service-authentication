# Managed by `a-novel repo update` — edit the template in stack, not this copy.
#
# Deletes this repository's container images once the branch or pull request that built them is gone.
# Closing a pull request deletes its `pr-<N>` image at once; a daily sweep takes the rest: untagged
# builds and tags of closed pull requests, merge-queue builds, old branch tags and master's untagged
# builds from before the last minor release. Every tag, master's builds since that release and open pull
# requests' images stay. A deleted version can be restored for 30 days.
name: clean images

on:
  # GitHub starts scheduled runs hours late, so a-novel/infra's Cloud Scheduler dispatches the daily sweep.
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted without deleting it
        type: boolean
        default: false
  pull_request:
    types: [closed]

permissions: {}

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      # A closed pull request's merge ref may be gone, so its base branch names the images.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          sparse-checkout: .github/workflows
          persist-credentials: false
      # A workflow token cannot list the organization's packages, so the images this repository's
      # workflows publish name them. A repository that publishes none lists none and cleans nothing.
      - name: List the images this repository publishes
        id: list
        run: |
          set -euo pipefail
          names=$(sed -n -E 's#.*image_name: \$\{\{ github\.repository \}\}([^ "]*).*#'"${GITHUB_REPOSITORY#*/}"'\1#p' \
            .github/workflows/*.yaml | sort -u | jq -R . | jq -sc .)
          echo "names=$names" >> "$GITHUB_OUTPUT"

  close:
    needs: [packages]
    if: >-
      github.event_name == 'pull_request' && needs.packages.outputs.names != '[]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: a-novel-kit/workflows/build-actions/clean-pr-images@v1.72.0
        with:
          pull_request: ${{ github.event.pull_request.number }}
          packages: ${{ needs.packages.outputs.names }}
          github_token: ${{ github.token }}

  sweep:
    needs: [packages]
    if: github.event_name != 'pull_request' && needs.packages.outputs.names != '[]'
    runs-on: ubuntu-latest
    # A day of builds takes minutes; a backlog that outlasts the limit resumes the next day.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Deletions share the repository's API quota with its CI, so packages take turns.
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.names) }}
    # The cleanup is not safe to run twice at once on one package.
    concurrency:
      group: clean-images-${{ matrix.package }}
      cancel-in-progress: false
    permissions:
      packages: write
      # The last minor release's commit dates the master builds it supersedes.
      contents: read
      pull-requests: read
      attestations: read
    steps:
      - uses: a-novel-kit/workflows/build-actions/clean-images@v1.72.0
        with:
          package: ${{ matrix.package }}
          github_token: ${{ github.token }}
          dry_run: ${{ inputs.dry_run || false }}
