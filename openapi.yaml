openapi: 3.1.0

servers:
  - url: http://127.0.0.1:{rest_port}
    variables:
      rest_port:
        default: "8080"

info:
  title: Authentication API
  summary: User authentication & account management.
  description: |
    This service primarily manages user accounts, from creation to authentication. A user account is a credential, which
    contains both private (*access data*) and public (*identifiers*) information.

    ## Access tokens

    Most routes require an access token for simpler permission management. Thus, most calls should expect at least an
    anonymous token, i.e. a token that grants fewer rights, but can be created on the fly without any plain credentials.

    Authenticated users can refresh their session using a refresh token. This token has a longer expiry date, and can
    be used to create new access tokens on-demand. There is no way to refresh a refresh token, so once it expires, the
    user must log in again. Signing out revokes the refresh token, so it can no longer renew the session.

    ## Short codes

    For some secure operations, users can receive a short code on a secure channel: this acts as a temporary, single-use
    password. The code is never returned by the API; the user retrieves it from that channel, then completes the
    operation with it. Usually, the message will contain a link for this very purpose.

    ## Single sign-on

    A person signs in on the account platform alone. Every other platform is a client of it, and signs the person in
    with the OAuth 2.0 authorization code grant ([RFC 6749 §4.1](https://www.rfc-editor.org/rfc/rfc6749#section-4.1))
    and PKCE ([RFC 7636](https://www.rfc-editor.org/rfc/rfc7636)), under their standard parameter names. The browser
    never reaches this service: the platforms' servers call it with their Kubernetes service token.

    1. The account platform checks the authorization request with `[GET] /v2/authorization-request`.
    2. It asks `[PUT] /v2/authorization-code` for a code in the session of the person signed in there, and sends the
       code to the client's redirect URI.
    3. The client trades the code and its PKCE verifier for a token pair with `[PUT] /v2/session/authorization-code`.
       The pair joins the account platform's session, so signing out anywhere signs the person out everywhere.

    A code signs an existing account in, and never creates one.
  version: v2.22.0
  license:
    name: AGPL-3.0
    url: "https://raw.githubusercontent.com/a-novel/service-authentication/refs/heads/master/LICENSE"

paths:
  /v2/ping:
    get:
      operationId: ping
      summary: Ping the server.
      description: |
        A simple endpoint to check if the server is up and running. It always returns the same response.

        This does not report on the server's dependencies. To assess the server's actual health, use the
        `/v2/healthcheck` endpoint.
      tags: [health]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/pong"
        "418":
          $ref: "#/components/responses/teapot"
        default:
          $ref: "#/components/responses/internalError"

  /v2/healthcheck:
    get:
      operationId: healthcheck
      summary: Health diagnosis of the server.
      description: |
        Probes every dependency and returns HTTP 200 only when all are healthy, or HTTP 503 otherwise.
        Both responses include the complete dependency report, with sanitized up/down states.
      tags: [health]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/health"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/health"
        "418":
          $ref: "#/components/responses/teapot"
        default:
          $ref: "#/components/responses/internalError"

  /v2/session:
    get:
      operationId: claimsGet
      summary: Returns the claims of an authenticated user.
      description: |
        Validate a user token, and extract the claims it contains. This route also works for anonymous tokens.

        A token whose session was signed out answers 401, like an invalid one. Other services verify access tokens
        offline and accept them until they expire, so a client calls this route to see a sign-out at once.
      tags: [session]
      security:
        - BearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/claimsGet"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"
    patch:
      operationId: tokenRefresh
      summary: Retrieve a new access token for the user.
      description: |
        Use the refresh token of a user to retrieve a new access token. This allows the user to extend its session 
        without logging in again. A refresh token cannot be refreshed once it expires, or once its session is signed
        out.
      tags: [session]
      security: []
      requestBody:
        $ref: "#/components/requestBodies/tokenRefresh"
      responses:
        "200":
          $ref: "#/components/responses/tokenRefresh"
        "400":
          $ref: "#/components/responses/badRequest"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"
    put:
      operationId: tokenCreate
      summary: Create a new access token from plain credentials.
      description: |
        Trade a user's plain credentials for a safe token it can use to authenticate against the API.

        Both an invalid email and an invalid password return the same 401 status, to avoid revealing whether an
        email is registered.

        By default, each visitor may try 10 logins per minute and 30 per 10 minutes, and each email 30 per 10 minutes.
      tags: [session]
      security: []
      requestBody:
        $ref: "#/components/requestBodies/credentials"
      responses:
        "200":
          $ref: "#/components/responses/tokenCreate"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/session/anon:
    put:
      operationId: tokenCreateAnon
      summary: Create a new anonymous access token.
      description: |
        Create an anonymous token to authenticate against the API without credentials.
        Anonymous tokens bear fewer rights than those of a plain authenticated user.

        By default, each visitor may create 3 anonymous tokens per 5 minutes.
      tags: [session]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/tokenCreate"
        "418":
          $ref: "#/components/responses/teapot"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/session/revoke:
    put:
      operationId: tokenRevoke
      summary: Sign out by revoking the session of a refresh token.
      description: |
        Revoke the session a refresh token belongs to, on every platform. No refresh token of the session renews it
        any more, and `GET /v2/session` refuses its access tokens. The caller authenticates with a valid access
        token, and the refresh token must belong to the same user. A client whose access token expired refreshes the
        session first.

        Revoking is idempotent: a refresh token already revoked or already expired also answers 204, so a retry never
        fails. A refresh token of another user, or one this service did not issue, such as an access token, answers 403.

        Other services verify access tokens offline, and accept the session's until they expire. A client discards its
        own when it signs out.
      tags: [session]
      security:
        - BearerAuth: ["session:revoke"]
      requestBody:
        $ref: "#/components/requestBodies/tokenRevoke"
      responses:
        "204":
          description: The session is revoked, or was already revoked or expired.
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/session/authorization-code:
    put:
      operationId: authorizationCodeExchange
      summary: Trade an authorization code for a token pair, as a client.
      description: |
        The client's server sends the code it received on its redirect URI, the PKCE verifier it drew, and that
        redirect URI ([RFC 6749 §4.1.3](https://www.rfc-editor.org/rfc/rfc6749#section-4.1.3)). The service identifies
        the client by its Kubernetes caller, and answers a token pair in the session the code was issued in. The
        refresh token stops renewing when that session ends.

        A code exchanges once, within a minute of its issue, for the client and the redirect URI it was issued to,
        with the verifier whose S256 hash is its challenge. Every refusal answers 403 and leaves the code as it was,
        except a second exchange of the same code: it also ends the session, on every platform, as
        [RFC 9700 §4.2.4](https://www.rfc-editor.org/rfc/rfc9700#section-4.2.4) advises.

        Only a registered client's service token may call this route. A server that verifies no service token, such as
        a local stack, answers 403.

        By default, each client may exchange 600 codes per minute.
      tags: [session]
      security: []
      requestBody:
        $ref: "#/components/requestBodies/authorizationCodeExchange"
      responses:
        "200":
          $ref: "#/components/responses/tokenCreate"
        "400":
          $ref: "#/components/responses/badRequest"
        "403":
          $ref: "#/components/responses/codeRefused"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/authorization-request:
    get:
      operationId: authorizationRequestValidate
      summary: Check that an authorization request names a client and its redirect URI.
      description: |
        The account platform calls this route when a browser opens its `/authorize` page, before it signs anyone in or
        redirects anywhere. A 204 means the `client_id` and the `redirect_uri` of the authorization request
        ([RFC 6749 §4.1.1](https://www.rfc-editor.org/rfc/rfc6749#section-4.1.1)) name a registered client and that
        client's redirect URI, compared as exact strings. On any other answer, the account platform shows an error page
        and redirects nowhere.

        Only the account platform's service token may call this route. A server that verifies no service token, such as
        a local stack, answers 403.
      tags: [authorization]
      security: []
      parameters:
        - $ref: "#/components/parameters/clientID"
        - $ref: "#/components/parameters/redirectURI"
      responses:
        "204":
          description: The client ID and the redirect URI name a registered client.
        "400":
          $ref: "#/components/responses/badRequest"
        "403":
          $ref: "#/components/responses/callerForbidden"
        "404":
          $ref: "#/components/responses/unknownClient"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/authorization-code:
    put:
      operationId: authorizationCodeCreate
      summary: Issue an authorization code for the person signed in on the account platform.
      description: |
        The account platform calls this route once `[GET] /v2/authorization-request` accepted the request and the person
        is signed in. The bearer token is theirs, and the body carries the parameters of the authorization request.
        The code signs that person in on the client, in the bearer token's session. The account platform then redirects
        to the client's redirect URI with the code, the request's `state` and its own `iss`
        ([RFC 9207](https://www.rfc-editor.org/rfc/rfc9207)).

        The code is valid one minute, for that client, that redirect URI and that PKCE challenge. Only `S256` challenges
        are accepted. A session that ended answers 401, as an invalid token does: the person signs in again.

        Only the account platform's service token may call this route. A server that verifies no service token, such as
        a local stack, answers 403.
      tags: [authorization]
      security:
        - BearerAuth: ["authorizationCode:create"]
      requestBody:
        $ref: "#/components/requestBodies/authorizationCodeCreate"
      responses:
        "200":
          $ref: "#/components/responses/authorizationCode"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/callerForbidden"
        "404":
          $ref: "#/components/responses/unknownClient"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/credentials:
    head:
      operationId: credentialsExists
      summary: Check if a given email is registered in the database.
      description: |
        Returns a success status if the email matches a registered user, or a not found (404) error otherwise.

        This endpoint deliberately reveals whether an email is registered, so it is restricted to callers holding
        the `credentials:exist` permission and should be granted only to trusted administrative roles.
      tags: [credentials]
      security:
        - BearerAuth: ["credentials:exist"]
      parameters:
        - $ref: "#/components/parameters/email"
      responses:
        "204":
          description: The email is used by a registered user.
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"
    get:
      operationId: credentialsGet
      summary: Retrieve the public credentials of a user.
      description: |
        Retrieve public information about a user. This is meant for discovery and does not contain sensitive data.
      tags: [credentials]
      security:
        - BearerAuth: ["credentials:get"]
      parameters:
        - $ref: "#/components/parameters/userID"
      responses:
        "200":
          $ref: "#/components/responses/credentialsGet"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"
    put:
      operationId: credentialsCreate
      summary: Register a new user.
      description: |
        Create a new user account with a short code received in a registration invitation. A super-admin must first
        send the invitation through `[PUT] /v2/short-code/register`.

        By default, each caller may try 10 sign-ups per minute and 30 per 10 minutes, and each email 30 per 10 minutes.
      tags: [credentials]
      security:
        - BearerAuth: ["credentials:create"]
      requestBody:
        $ref: "#/components/requestBodies/credentialsCreate"
      responses:
        "200":
          $ref: "#/components/responses/tokenCreate"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          $ref: "#/components/responses/conflict"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/credentials/all:
    get:
      operationId: credentialsList
      summary: Browse public credentials.
      description: |
        Browse public user credentials from the platform.
      tags: [credentials]
      security:
        - BearerAuth: ["credentials:list"]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/userRoles"
      responses:
        "200":
          $ref: "#/components/responses/credentialsList"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/credentials/self:
    get:
      operationId: credentialsGetSelf
      summary: Retrieve the credentials of the authenticated user.
      description: |
        Retrieve the account of the user bearing the access token, with the email change awaiting confirmation, if
        any. Anonymous tokens lack the required permission.
      tags: [credentials]
      security:
        - BearerAuth: ["credentials:self:get"]
      responses:
        "200":
          $ref: "#/components/responses/credentialsGetSelf"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/credentials/email:
    patch:
      operationId: emailUpdate
      summary: Update the user email.
      description: |
        Completes the email update process. The user must have a short-code available, generated during the initial 
        phase. If not, use `[PUT] /v2/short-code/update-email` first.

        By default, each caller may try 10 email updates per minute and 30 per 10 minutes, and each account 30 per 10
        minutes.
      tags: [credentials]
      security:
        - BearerAuth: ["credentials:email:patch"]
      requestBody:
        $ref: "#/components/requestBodies/emailUpdate"
      responses:
        "200":
          $ref: "#/components/responses/credentialsGet"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/credentials/password:
    patch:
      operationId: passwordUpdate
      summary: Update the user password.
      description: |
        Update the password of a user. The current password must be provided as an extra safeguard.

        By default, each user may try 10 password updates per minute and 30 per 10 minutes.
      tags: [credentials]
      security:
        - BearerAuth: ["credentials:password:patch"]
      requestBody:
        $ref: "#/components/requestBodies/passwordUpdate"
      responses:
        "200":
          $ref: "#/components/responses/credentialsGet"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"
    put:
      operationId: passwordReset
      summary: Reset the user password.
      description: |
        Completes the password reset process. The user must have a short-code available, generated during the initial 
        phase. If not, use `[PUT] /v2/short-code/update-password` first.

        By default, each caller may try 10 password resets per minute and 30 per 10 minutes, and each account 30 per
        10 minutes.
      tags: [credentials]
      security:
        - BearerAuth: ["credentials:password:reset"]
      requestBody:
        $ref: "#/components/requestBodies/passwordReset"
      responses:
        "200":
          $ref: "#/components/responses/credentialsGet"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/credentials/role:
    patch:
      operationId: roleUpdate
      summary: Update the user role.
      description: |
        Update the role of a user. Beyond holding the required permission, the caller's own role must sit higher in
        the hierarchy than the target user's current role, and cannot grant privileges above its own.
      tags: [credentials]
      security:
        - BearerAuth: ["credentials:role:patch"]
      requestBody:
        $ref: "#/components/requestBodies/roleUpdate"
      responses:
        "200":
          $ref: "#/components/responses/credentialsGet"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v2/waitlist:
    put:
      operationId: waitlistJoin
      summary: Request an invitation.
      description: |
        Records an email and preferred language in the temporary private invitation list.
        Anonymous sessions have this permission. This sends no email, creates no account,
        and does not grant permission to register. Super-admin invitations remain separate.

        New entries receive an empty 202. A 409 distinguishes existing accounts from duplicate requests.
        These warnings intentionally reveal membership to the caller. Existing accounts do not create rows.
        Email comparison matches the account store exactly;
        case and provider-specific aliases are not normalized.

        By default, each caller may send 3 requests per 5 minutes.
      tags: [waitlist]
      security:
        - BearerAuth: ["waitlist:join"]
      requestBody:
        $ref: "#/components/requestBodies/waitlistJoin"
      responses:
        "202":
          description: The invitation request was recorded.
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          $ref: "#/components/responses/waitlistConflict"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          description: |
            The caller sent too many requests, the writer is busy, or the temporary list is full. Retry
            once `Retry-After` has elapsed.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
        "503":
          description: |
            The integration is disabled or unreachable. During a planned downtime, a problem body tagged
            `downtime`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/plannedDowntimeProblem"
        default:
          $ref: "#/components/responses/internalError"

  /v2/short-code/register:
    put:
      operationId: registerInit
      summary: Invite a user to register.
      description: |
        A super-admin starts the registration process by sending a link with a unique short code to the user's email.
        The recipient can then complete registration with an anonymous access token and the received code.

        The response is always 202 whether or not the email is already registered, to avoid revealing which
        emails have accounts. No email is sent when the address is already registered.

        By default, each email may receive 3 invitations per hour.
      tags: [shortCode]
      security:
        - BearerAuth: ["shortCode:register"]
      requestBody:
        $ref: "#/components/requestBodies/registerInit"
      responses:
        "202":
          description: |
            The request was accepted. If the email is not already registered, a registration link will be sent.
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/mailDeliveryUnavailable"
        default:
          $ref: "#/components/responses/internalError"

  /v2/short-code/update-email:
    put:
      operationId: emailUpdateInit
      summary: Start the email update process.
      description: |
        Start the email update process, by sending a link with a unique short code to the user new email. If the user
        manages to open the link, it means the email is valid and no further validation is required. The email can be
        changed safely.

        By default, each caller may send 3 requests per 5 minutes, and each email receive 3 per hour.
      tags: [shortCode]
      security:
        - BearerAuth: ["shortCode:email:update"]
      requestBody:
        $ref: "#/components/requestBodies/emailUpdateInit"
      responses:
        "202":
          description: |
            The request was accepted. If the email is not already registered, an email update link will be sent.

            The response is always 202 whether or not the email is registered, to avoid revealing which emails
            have accounts. For the same reason, `[GET] /v2/credentials/self` shows the change as pending either way.
            No email is sent when the address is already registered, so that change can never be confirmed.
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/mailDeliveryUnavailable"
        default:
          $ref: "#/components/responses/internalError"

  /v2/short-code/update-password:
    put:
      operationId: passwordResetInit
      summary: Start the password reset process.
      description: |
        Start the password reset process, by sending a link with a unique short code to the user email.

        The response is always 202 whether or not the email is registered, to avoid revealing which emails
        have accounts. No email is sent when the address is not registered.

        By default, each caller may send 3 requests per 5 minutes, and each email receive 3 per hour.
      tags: [shortCode]
      security:
        - BearerAuth: ["shortCode:password:reset"]
      requestBody:
        $ref: "#/components/requestBodies/passwordResetInit"
      responses:
        "202":
          description: |
            The request was accepted. If the email is registered, a password reset link will be sent.
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/mailDeliveryUnavailable"
        default:
          $ref: "#/components/responses/internalError"

components:
  responses:
    waitlistConflict:
      description: The address is registered or already has an invitation request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/waitlistConflict"
    pong:
      description: The server is up and running.
      content:
        text/plain:
          schema:
            type: string
            examples: [pong]

    plannedDowntime:
      description: |
        The service, or a service it depends on, is in a planned downtime and refuses work until
        operators end it. The platform reads the announced window from the downtime document infra
        publishes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/plannedDowntimeProblem"

    health:
      description: |
        Complete dependency report; HTTP 200 means all are up, HTTP 503 means at least one is down.
        During a planned downtime, HTTP 503 carries a problem body tagged `downtime` instead.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/plannedDowntimeProblem"
        application/json:
          schema:
            type: object
            required: ["client:postgres", "client:smtp", "api:jsonKeys"]
            additionalProperties:
              $ref: "#/components/schemas/healthStatus"
            properties:
              "client:postgres":
                $ref: "#/components/schemas/healthStatus"
              "client:smtp":
                $ref: "#/components/schemas/healthStatus"
              "api:jsonKeys":
                $ref: "#/components/schemas/healthStatus"
            examples:
              - {
                  "client:postgres": { "status": "up" },
                  "client:smtp": { "status": "up" },
                  "api:jsonKeys": { "status": "up" },
                }
              - {
                  "client:postgres": { "status": "up" },
                  "client:smtp": { "status": "up" },
                  "api:jsonKeys": { "status": "down" },
                }

    claimsGet:
      description: The decoded content of a JWT token payload, in JSON format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/claims"

    tokenRefresh:
      description: |
        The tokens set used by a user to authenticate against the API, without plain credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/token"

    tokenCreate:
      description: |
        The tokens set used by a user to authenticate against the API, without plain credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/token"

    credentialsGet:
      description: The public credentials of the target user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publicCredentials"

    credentialsGetSelf:
      description: The credentials of the authenticated user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/selfCredentials"
          examples:
            noPendingEmail:
              summary: No email change awaits confirmation.
              value:
                {
                  "id": "9dce0fa2-f93b-46a9-aa6b-a71bf0b1ee80",
                  "email": "john.doe@gmail.com",
                  "role": "auth:user",
                  "createdAt": "2009-11-10T23:00:00Z",
                  "updatedAt": "2009-11-10T23:00:00Z",
                }
            pendingEmail:
              summary: An email change awaits confirmation.
              value:
                {
                  "id": "9dce0fa2-f93b-46a9-aa6b-a71bf0b1ee80",
                  "email": "john.doe@gmail.com",
                  "role": "auth:user",
                  "createdAt": "2009-11-10T23:00:00Z",
                  "updatedAt": "2009-11-10T23:00:00Z",
                  "pendingEmail": { "email": "john.doe@proton.me", "expiresAt": "2009-11-12T23:00:00Z" },
                }

    credentialsList:
      description: The list of public credentials.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/publicCredentials"

    authorizationCode:
      description: The code the account platform adds to the client's redirect URI.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            additionalProperties: false
            properties:
              code:
                $ref: "#/components/schemas/authorizationCode"

    callerForbidden:
      description: |
        The caller may not call this route: its service token names another service than the account platform, or
        the server verifies no service token. A bearer token without the route's permission answers 403 too.

    unknownClient:
      description: |
        No registered client has this client ID and this redirect URI: the client is unknown, or its redirect URI is
        another one.

    codeRefused:
      description: |
        The code was refused: it is unknown or expired, it was already exchanged, it was issued to another client or
        another redirect URI, the verifier does not match it, or its session ended. The caller may also be no
        registered client. A second exchange of a code also ends its session.

    unauthorized:
      description: |
        The provided credentials are invalid. For security reasons, this response does not indicate
        whether the email exists or the password is incorrect.

    invalidToken:
      description: |
        The bearer token is invalid, for instance expired, or missing where the route requires a permission.
        Refresh the session or authenticate again.

    forbidden:
      description: |
        The user was authenticated successfully, but its current access rights don't grant permission for
        this operation.

    unprocessableEntity:
      description: |
        The request was understood by the server, but cannot be processed because the data did not pass
        required validation. The body names each invalid field and the rule it broke.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/invalidRequest"

    notFound:
      description: |
        The requested data was not found on the server.

    badRequest:
      description: |
        The request sent to the server could not be parsed.

    conflict:
      description: |
        The record already exists.

    mailDeliveryUnavailable:
      description: |
        The server is not accepting email deliveries, for instance while it shuts down. Retry later.
        During a planned downtime, a problem body tagged `downtime`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/plannedDowntimeProblem"

    tooManyRequests:
      description: |
        The caller sent too many requests to this route, or too many named the same email or account. Retry once
        `Retry-After` has elapsed.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer

    internalError:
      description: Something unexpected happened.

    teapot:
      description: I'm a teapot!

  schemas:
    invalidRequest:
      type: object
      description: |
        An RFC 9457 problem details body whose tags name the request fields that failed validation. Field
        paths and rule codes come from the API definition, never from the submitted values.
      required: [type, title, status, tags]
      additionalProperties: false
      properties:
        type:
          type: string
          description: The problem type; about:blank makes the title the HTTP status text.
          const: about:blank
        title:
          type: string
          description: The HTTP status text.
          examples: [Unprocessable Entity]
        status:
          type: integer
          description: The HTTP status code.
          const: 422
        tags:
          type: object
          description: Public details about the failure. Clients ignore tags they do not know.
          required: [invalidFields]
          additionalProperties: true
          properties:
            invalidFields:
              type: object
              description: |
                Maps the path of each invalid field, in lower camel case with `.` for nesting and `[i]` for a
                list item, to the validation rule it broke. Standard rules carry their usual name (required,
                email, min, max); service rules name a domain check (langs, role).
              additionalProperties:
                type: string
              examples:
                - { "email": "email", "lang": "langs" }
                - { "roles[0]": "role" }
    waitlistConflict:
      type: object
      description: A stable warning for the invitation form; no input or internal details are returned.
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Whether an account or a pending invitation request already exists.
          enum: [account_exists, already_waitlisted]
          examples: [account_exists, already_waitlisted]
    plannedDowntimeProblem:
      type: object
      description: |
        An RFC 9457 problem details body answering a request refused during a planned downtime. Clients
        ignore extension members they do not know.
      required: [type, title, status, tags]
      additionalProperties: true
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          const: 503
        tags:
          type: object
          required: [downtime]
          properties:
            downtime:
              type: boolean
              const: true

    healthStatus:
      type: object
      description: |
        Status of a single dependency entry, as observed by the server. It carries the
        state alone, so an unauthenticated caller cannot infer infrastructure details
        from a degraded dependency; richer diagnostics are recorded on server-side traces.
      required: [status]
      additionalProperties: false
      examples:
        - { "status": "up" }
        - { "status": "down" }
      properties:
        status:
          type: string
          description: Exposes whether the server managed to connect to the dependency.
          enum: [up, down]

    claims:
      type: object
      description: |
        The claims of an authenticated user, contained in its JSON Web Token payload.
        The user can be anonymous, meaning it is not linked to any existing user ID.
        Clients ignore claims they do not know.
      additionalProperties: true
      examples:
        - {
            "userID": "9dce0fa2-f93b-46a9-aa6b-a71bf0b1ee80",
            "roles": ["auth:user"],
            "refreshTokenID": "3d53bd5c-16f6-47a1-a4a6-7c2ee1793664",
            "sessionID": "3d53bd5c-16f6-47a1-a4a6-7c2ee1793664",
          }
        - { "roles": ["auth:anon"] }
      properties:
        userID:
          $ref: "#/components/schemas/userID"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/userRole"
        refreshTokenID:
          $ref: "#/components/schemas/refreshTokenID"
        sessionID:
          $ref: "#/components/schemas/sessionID"

    publicCredentials:
      type: object
      description: Publicly exposed credentials, without any sensitive data such as the password.
      required: [id, email, role, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/userID"
        email:
          $ref: "#/components/schemas/email"
        role:
          $ref: "#/components/schemas/userRole"
        createdAt:
          type: string
          format: date-time
          examples: [2009-11-10T23:00:00Z]
        updatedAt:
          type: string
          format: date-time
          examples: [2009-11-10T23:00:00Z]

    selfCredentials:
      type: object
      description: The credentials of the authenticated user, without any sensitive data such as the password.
      required: [id, email, role, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/userID"
        email:
          $ref: "#/components/schemas/email"
        role:
          $ref: "#/components/schemas/userRole"
        createdAt:
          type: string
          format: date-time
          examples: [2009-11-10T23:00:00Z]
        updatedAt:
          type: string
          format: date-time
          examples: [2009-11-10T23:00:00Z]
        pendingEmail:
          $ref: "#/components/schemas/pendingEmail"

    pendingEmail:
      type: object
      description: |
        An email change requested through `[PUT] /v2/short-code/update-email` and awaiting confirmation. It lasts until
        the user confirms it, requests another change, or lets the confirmation code expire. Absent when no change
        awaits confirmation.
      required: [email, expiresAt]
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/email"
        expiresAt:
          type: string
          description: When the confirmation code expires.
          format: date-time
          examples: [2009-11-12T23:00:00Z]

    token:
      type: object
      description: |
        The tokens set used by a user to authenticate against the API, without plain credentials.
      required: [accessToken, refreshToken]
      additionalProperties: false
      properties:
        accessToken:
          $ref: "#/components/schemas/accessToken"
        refreshToken:
          $ref: "#/components/schemas/refreshToken"

    clientID:
      type: string
      description: The ID of a client in the client registry, the `client_id` parameter of OAuth 2.0.
      maxLength: 256
      examples: [studio]

    redirectURI:
      type: string
      description: |
        The URI the account platform sends a client's code to, the `redirect_uri` parameter of OAuth 2.0. It must be
        exactly the one the client registry holds for the client.
      format: uri
      maxLength: 2048
      examples: ["https://studio.storyverse.fr/auth/callback"]

    authorizationCode:
      type: string
      description: A one-time authorization code, 256 random bits encoded as base64url without padding.
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{43}$"
      examples: [SplxlOBeZQQYbYS6WxSbIA-cRM_mJ6eoJkHvd3Zm3zQ]

    codeChallenge:
      type: string
      description: |
        The PKCE challenge, the base64url SHA-256 of the client's code verifier, without padding
        ([RFC 7636 §4.2](https://www.rfc-editor.org/rfc/rfc7636#section-4.2)).
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{43}$"
      examples: [E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM]

    codeChallengeMethod:
      type: string
      description: The method that derives the PKCE challenge from the verifier. Only `S256` is accepted.
      const: S256

    codeVerifier:
      type: string
      description: |
        The PKCE verifier the client drew for the authorization request
        ([RFC 7636 §4.1](https://www.rfc-editor.org/rfc/rfc7636#section-4.1)).
      minLength: 43
      maxLength: 128
      examples: [dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk]

    userID:
      type: string
      description: The unique identifier of a user in the database.
      format: uuid
      examples:
        - "9dce0fa2-f93b-46a9-aa6b-a71bf0b1ee80"

    userRole:
      type: string
      description: |
        The role grants certain access rights to the user bearing the token.
      enum: ["auth:anon", "auth:user", "auth:admin", "auth:superadmin"]

    refreshTokenID:
      type: string
      description: Identifies a refresh token the user can use to renew its main access token.
      format: uuid
      examples:
        - "3d53bd5c-16f6-47a1-a4a6-7c2ee1793664"

    sessionID:
      type: string
      description: |
        Identifies the session a token belongs to: everything one sign-in opened, from its own token pair to every
        token pair a platform obtained from it. Signing out revokes the whole session. A sign-in's session ID is the
        ID of the refresh token it issued, so an anonymous token has none.
      format: uuid
      examples:
        - "3d53bd5c-16f6-47a1-a4a6-7c2ee1793664"

    accessToken:
      type: string
      description: A JSON Web Token (JWT) that can be used to authenticate a user on the platform.
      format: jwt
      examples:
        - >-
          eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzUxMiIsImtpZCI6IjQ0ZGU3Y2Q3YWZmMWU2YzQ0MjA3NGU4MzQxZDc5MmM3In0.eyJ1c2VySUQiOiI5ZG
          NlMGZhMi1mOTNiLTQ2YTktYWE2Yi1hNzFiZjBiMWVlODAiLCJyb2xlcyI6ImF1dGg6dXNlciIsInJlZnJlc2hUb2tlbklEIjoiM2Q1M2JkNWMt
          MTZmNi00N2ExLWE0YTYtN2MyZWUxNzkzNjY0In0.AW10XXvH337pXozTnOPDGjftGSKEzt1fP8iSxGsX76c02uamyM-aJ-0UQyKe3kZctwe6ez
          CmRmmh2Fu7qZatesChALRlZ7PF9QiDtDf-ESNWfdqm1fUypXjn1spHIpRsgWglXvVgO0nbFoOwoBkkyRvB9GBCHOBJ6o2Y5OGc6TXu_yL5

    refreshToken:
      type: string
      description: A JSON Web Token (JWT) that can be used to refresh the access token of a user.
      format: jwt
      examples:
        - >-
          eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzUxMiIsImtpZCI6IjQ0ZGU3Y2Q3YWZmMWU2YzQ0MjA3NGU4MzQxZDc5MmM3In0.eyJ1c2VySUQiOiI5ZG
          NlMGZhMi1mOTNiLTQ2YTktYWE2Yi1hNzFiZjBiMWVlODAiLCJqdGkiOiIzZDUzYmQ1Yy0xNmY2LTQ3YTEtYTRhNi03YzJlZTE3OTM2NjQifQ.A
          MTi8QCCO5B8QYorveMHoGXfRO8QUP9ru381lIKHOMn-cO4g3yL9Xxbh2YDCAWgRalqiLTE1C-JLMRfHeumgOL1ZAaChGMUdM_BYu0eXpnyqjbi
          us4_ThFO_-DSaQhJciDtGYJQQP1pkCMqmL5EWi-ic55pUmb_tX3dClrgccNT6k0bL

    email:
      type: string
      description: A user's email address.
      format: email
      maxLength: 1024
      examples: [john.doe@gmail.com]

    password:
      type: string
      minLength: 4
      maxLength: 1024
      description: The user's plaintext password.
      examples: [hackthenasa]

    shortCode:
      type: string
      description: |
        A temporary, single-use code delivered to the user on a secure channel to authorize a sensitive operation.
      maxLength: 1024
      examples: [abcdef123456]

    limit:
      type: number
      description: Maximum number of results to return in a single page.
      format: int
      minimum: 1
      maximum: 100

    offset:
      type: number
      description: Number of leading results to skip, for pagination.
      format: int
      minimum: 0

    lang:
      type: string
      description: Language for user-facing messages, as an ISO 639 code.
      format: ISO-639
      enum: [en, fr]

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    userID:
      name: id
      in: query
      description: The ID of the credentials to retrieve.
      required: true
      schema:
        $ref: "#/components/schemas/userID"

    email:
      name: email
      in: query
      description: The email of a registered user.
      required: true
      schema:
        $ref: "#/components/schemas/email"

    limit:
      name: limit
      in: query
      description: Limit the number of results.
      required: true
      schema:
        $ref: "#/components/schemas/limit"

    offset:
      name: offset
      in: query
      description: Skip results for pagination.
      required: false
      schema:
        $ref: "#/components/schemas/offset"

    clientID:
      name: client_id
      in: query
      description: The client the authorization request names.
      required: true
      schema:
        $ref: "#/components/schemas/clientID"

    redirectURI:
      name: redirect_uri
      in: query
      description: The redirect URI the authorization request names.
      required: true
      schema:
        $ref: "#/components/schemas/redirectURI"

    userRoles:
      name: roles
      in: query
      description: Filter users on roles.
      required: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/userRole"

  requestBodies:
    waitlistJoin:
      description: Email and preferred language for an invitation request.
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, lang]
            properties:
              email:
                $ref: "#/components/schemas/email"
              lang:
                $ref: "#/components/schemas/lang"

    tokenRefresh:
      description: The tokens set to refresh.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/token"

    tokenRevoke:
      description: The refresh token of the session to end.
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            additionalProperties: false
            properties:
              refreshToken:
                $ref: "#/components/schemas/refreshToken"

    authorizationCodeCreate:
      description: The parameters of the authorization request the code answers, under their OAuth 2.0 names.
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [client_id, redirect_uri, code_challenge, code_challenge_method]
            additionalProperties: false
            properties:
              client_id:
                $ref: "#/components/schemas/clientID"
              redirect_uri:
                $ref: "#/components/schemas/redirectURI"
              code_challenge:
                $ref: "#/components/schemas/codeChallenge"
              code_challenge_method:
                $ref: "#/components/schemas/codeChallengeMethod"

    authorizationCodeExchange:
      description: The code to exchange, its verifier and its redirect URI, under their OAuth 2.0 names.
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code, code_verifier, redirect_uri]
            additionalProperties: false
            properties:
              code:
                $ref: "#/components/schemas/authorizationCode"
              code_verifier:
                $ref: "#/components/schemas/codeVerifier"
              redirect_uri:
                $ref: "#/components/schemas/redirectURI"

    credentials:
      description: |
        The plain credentials of the user. A new JWT will be created using those.
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                $ref: "#/components/schemas/email"
              password:
                $ref: "#/components/schemas/password"

    credentialsCreate:
      description: |
        The plain credentials of the user. Both a new account and JWT will be created using those.
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password, shortCode]
            properties:
              email:
                $ref: "#/components/schemas/email"
              password:
                $ref: "#/components/schemas/password"
              shortCode:
                $ref: "#/components/schemas/shortCode"

    emailUpdate:
      description: Update the email of a user.
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [userID, shortCode]
            properties:
